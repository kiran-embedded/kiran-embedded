<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="actBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2E2054" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A1838" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Purple Wave Chart Gradient -->
    <linearGradient id="chartWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0E1E" stop-opacity="0" />
    </linearGradient>

    <!-- Realistic Candle Flame Gradients -->
    <!-- Outer Fiery Orange-Red Gradient -->
    <linearGradient id="flameOuterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2A00" />
      <stop offset="35%" stop-color="#FF5722" />
      <stop offset="70%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <!-- Mid Flame Amber-Gold Gradient -->
    <linearGradient id="flameMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="45%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FFFF00" />
    </linearGradient>

    <!-- Candle Glow Filter -->
    <filter id="candleBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Realistic Candle Flame Fluid Dynamics */
    @keyframes realisticFlame {
      0%, 100% {
        transform: scale(1, 1) rotate(0deg);
        filter: drop-shadow(0 -2px 5px rgba(255, 87, 34, 0.85)) drop-shadow(0 -5px 12px rgba(255, 42, 0, 0.5));
      }
      20% {
        transform: scale(0.94, 1.06) rotate(-2.5deg) skewX(-1.5deg);
        filter: drop-shadow(0 -3px 7px rgba(255, 145, 0, 0.95)) drop-shadow(0 -6px 14px rgba(255, 42, 0, 0.6));
      }
      40% {
        transform: scale(1.05, 0.95) rotate(2deg) skewX(1deg);
        filter: drop-shadow(0 -2px 4px rgba(255, 87, 34, 0.8)) drop-shadow(0 -4px 10px rgba(255, 42, 0, 0.45));
      }
      60% {
        transform: scale(0.96, 1.04) rotate(-1.5deg) skewX(-1deg);
        filter: drop-shadow(0 -3px 8px rgba(255, 145, 0, 0.9)) drop-shadow(0 -5px 13px rgba(255, 42, 0, 0.55));
      }
      80% {
        transform: scale(1.03, 0.97) rotate(2.2deg) skewX(1.5deg);
        filter: drop-shadow(0 -2px 6px rgba(255, 87, 34, 0.85)) drop-shadow(0 -5px 11px rgba(255, 42, 0, 0.5));
      }
    }

    @keyframes innerCoreFlicker {
      0%, 100% { transform: scale(1, 1) translateY(0); opacity: 0.95; }
      25% { transform: scale(0.92, 1.08) translateY(-0.6px); opacity: 1; }
      65% { transform: scale(1.06, 0.94) translateY(0.4px); opacity: 0.9; }
      85% { transform: scale(0.97, 1.03) translateY(-0.2px); opacity: 0.98; }
    }

    @keyframes sparkRise1 {
      0% { transform: translate(0, 0); opacity: 0.9; }
      100% { transform: translate(4px, -11px); opacity: 0; }
    }
    @keyframes sparkRise2 {
      0% { transform: translate(0, 0); opacity: 0.8; }
      100% { transform: translate(-3px, -13px); opacity: 0; }
    }
    @keyframes boltFlicker {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 3px #F59E0B); }
      50% { opacity: 1; filter: drop-shadow(0 0 7px #FBBF24); }
    }
    @keyframes codePulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 5px #C084FC); }
    }

    .card-bg {
      fill: #0B0E1E;
      stroke: url(#actBorder);
      stroke-width: 1.2;
      rx: 12px;
    }
    .head-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .filter-btn {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      fill: #94A3B8;
    }
    .stat-box {
      fill: #0E1224;
      stroke: #1F2848;
      stroke-width: 1;
      rx: 8px;
    }
    .stat-num {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 800;
      fill: #FFFFFF;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      fill: #94A3B8;
    }
    .user-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #FFFFFF;
    }
    .meta-line {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      fill: #CBD5E1;
    }
    .axis-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9px;
      font-weight: 500;
      fill: #64748B;
    }

    .realistic-candle-flame {
      animation: realisticFlame 2.2s ease-in-out infinite;
      transform-origin: 0px 20px;
    }
    .flame-inner-core {
      animation: innerCoreFlicker 1.1s ease-in-out infinite;
      transform-origin: 0px 20px;
    }
    .spark-p1 {
      animation: sparkRise1 1.8s ease-out infinite;
    }
    .spark-p2 {
      animation: sparkRise2 2.1s ease-out infinite 0.7s;
    }
  </style>

  <!-- Main Container -->
  <rect x="2" y="2" width="916" height="226" class="card-bg" />

  <!-- Header -->
  <g transform="translate(24, 26)">
    <rect x="0" y="-12" width="24" height="24" rx="6" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.2" />
    <path d="M 6 4 L 10 -2 L 14 2 L 18 -6" fill="none" stroke="#C084FC" stroke-width="1.6" stroke-linecap="round" />
    <text x="34" y="5" class="head-title">Activity &amp; Statistics</text>

    <!-- Filter Toggle: 7D 30D 90D 1Y -->
    <g transform="translate(730, -10)">
      <rect x="0" y="0" width="138" height="22" rx="11" fill="#0E1224" stroke="#252F52" stroke-width="0.8" />
      <text x="18" y="15" class="filter-btn">7D</text>
      <text x="46" y="15" class="filter-btn">30D</text>
      <rect x="68" y="2" width="36" height="18" rx="9" fill="#7C3AED" />
      <text x="86" y="15" class="filter-btn" fill="#FFFFFF" text-anchor="middle">90D</text>
      <text x="120" y="15" class="filter-btn">1Y</text>
    </g>
  </g>

  <!-- Top Row: 3 Metric Boxes -->
  <g transform="translate(24, 46)">
    <!-- 1. Total Contributions -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="276" height="58" class="stat-box" />
      <text x="138" y="20" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle" style="animation: codePulse 2.5s infinite;">&lt;/&gt;</text>
      <text x="138" y="38" class="stat-num" text-anchor="middle">43</text>
      <text x="138" y="50" class="stat-label" text-anchor="middle">Total Contributions</text>
    </g>

    <!-- 2. Current Streak with Realistic Dancing Candle Flame -->
    <g transform="translate(298, 0)">
      <rect x="0" y="0" width="276" height="58" class="stat-box" />

      <!-- Realistic Candle Flame System -->
      <g transform="translate(138, 4)">
        <!-- Candle Wick -->
        <path d="M 0,22 Q 0.8,19 0,16.5" stroke="#334155" stroke-width="1.2" stroke-linecap="round" fill="none" />
        <!-- Glowing Red-Hot Ember Tip on Wick -->
        <circle cx="0" cy="16.5" r="0.9" fill="#FF1744" />

        <!-- Floating Micro Sparks -->
        <circle cx="1" cy="4" r="0.7" fill="#FFD600" class="spark-p1" />
        <circle cx="-1.5" cy="2" r="0.6" fill="#FF9100" class="spark-p2" />

        <!-- Dancing Flame Body -->
        <g class="realistic-candle-flame">
          <!-- Subtle Blue Oxygenated Base Halo -->
          <ellipse cx="0" cy="18" rx="3.5" ry="2" fill="#00E5FF" opacity="0.65" />

          <!-- Outer Dynamic Flame Teardrop -->
          <path d="M 0,0 C 2,5 6,10 6,15 C 6,19 3,21 0,21 C -3,21 -6,19 -6,15 C -6,10 -2,5 0,0 Z" fill="url(#flameOuterGrad)" />

          <!-- Middle Amber-Gold Flame Body -->
          <path d="M 0,4 C 1.5,8 4,12 4,16 C 4,19 2,20.5 0,20.5 C -2,20.5 -4,19 -4,16 C -4,12 -1.5,8 0,4 Z" fill="url(#flameMidGrad)" />

          <!-- Inner White-Hot Incandescent Core with Independent Turbulence -->
          <g class="flame-inner-core">
            <path d="M 0,9 C 1,12 2.2,14.5 2.2,17 C 2.2,19.2 1.2,20 0,20 C -1.2,20 -2.2,19.2 -2.2,17 C -2.2,14.5 -1,12 0,9 Z" fill="#FFFFFF" />
            <ellipse cx="0" cy="17" rx="1.2" ry="2.2" fill="#FFFDE7" opacity="0.95" />
          </g>
        </g>
      </g>

      <text x="138" y="38" class="stat-num" text-anchor="middle">1</text>
      <text x="138" y="50" class="stat-label" text-anchor="middle">Current Streak</text>
    </g>

    <!-- 3. Longest Streak with Glowing Electric Bolt -->
    <g transform="translate(596, 0)">
      <rect x="0" y="0" width="276" height="58" class="stat-box" />
      <g transform="translate(138, 14)">
        <path d="M -1 -7 L -5 0 L 1 0 L -1 7 L 5 -1 L -1 -1 Z" fill="#F59E0B" stroke="#FBBF24" stroke-width="0.8" style="animation: boltFlicker 2s ease-in-out infinite;" />
      </g>
      <text x="138" y="38" class="stat-num" text-anchor="middle">3</text>
      <text x="138" y="50" class="stat-label" text-anchor="middle">Longest Streak</text>
    </g>
  </g>

  <!-- Bottom Row: Chart Card -->
  <g transform="translate(24, 114)">
    <rect x="0" y="0" width="872" height="102" class="stat-box" />

    <!-- Left: Profile Info -->
    <g transform="translate(20, 22)">
      <text x="0" y="0" class="user-name">kiran-embedded (Kiran)</text>

      <g transform="translate(0, 16)">
        <text x="0" y="0" font-size="10">📊</text>
        <text x="16" y="0" class="meta-line">43 Contributions on GitHub</text>
      </g>

      <g transform="translate(0, 32)">
        <text x="0" y="0" font-size="10">📁</text>
        <text x="16" y="0" class="meta-line">23 Repositories</text>
      </g>

      <g transform="translate(0, 48)">
        <text x="0" y="0" font-size="10">📅</text>
        <text x="16" y="0" class="meta-line">Joined GitHub 11 months ago</text>
      </g>

      <g transform="translate(0, 64)">
        <text x="0" y="0" font-size="10">📍</text>
        <text x="16" y="0" class="meta-line">Thrissur, India</text>
      </g>
    </g>

    <!-- Right: Smooth Purple Glowing Wave Area Chart -->
    <g transform="translate(320, 15)">
      <!-- Wave Area Fill -->
      <path d="M 0 75 Q 50 72 80 55 T 160 52 T 240 50 T 320 30 T 400 55 T 460 20 T 520 75 Z" fill="url(#chartWaveGrad)" />

      <!-- Wave Stroke -->
      <path d="M 0 75 Q 50 72 80 55 T 160 52 T 240 50 T 320 30 T 400 55 T 460 20 T 520 75" fill="none" stroke="#C084FC" stroke-width="2.2" filter="drop-shadow(0 0 6px rgba(168, 85, 247, 0.5))" />

      <!-- Baseline -->
      <line x1="0" y1="75" x2="520" y2="75" stroke="#1E2746" stroke-width="1" />

      <!-- X-Axis Date Labels -->
      <text x="10" y="88" class="axis-label">7 Oct</text>
      <text x="135" y="88" class="axis-label">14 Oct</text>
      <text x="260" y="88" class="axis-label">21 Oct</text>
      <text x="385" y="88" class="axis-label">28 Oct</text>
      <text x="500" y="88" class="axis-label">4 Nov</text>
    </g>
  </g>
</svg>