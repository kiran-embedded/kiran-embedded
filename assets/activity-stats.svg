<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="actBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2E2054" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A1838" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Purple Wave Chart Gradient -->
    <linearGradient id="chartWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0B0E1E" stop-opacity="0" />
    </linearGradient>

    <!-- Wave Stroke Glow Filter -->
    <filter id="waveGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-bg {
      fill: #0B0E1E;
      stroke: url(#actBorder);
      stroke-width: 1.2;
      rx: 12px;
    }
    .head-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .filter-btn {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      fill: #94A3B8;
    }
    .stat-box {
      fill: #0E1224;
      stroke: #1F2848;
      stroke-width: 1;
      rx: 8px;
    }
    .stat-num {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 800;
      fill: #FFFFFF;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      fill: #94A3B8;
    }
    .user-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #FFFFFF;
    }
    .meta-line {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      fill: #CBD5E1;
    }
    .axis-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9px;
      fill: #64748B;
    }
  </style>

  <!-- Main Container -->
  <rect x="2" y="2" width="916" height="226" class="card-bg" />

  <!-- Header -->
  <g transform="translate(24, 26)">
    <rect x="0" y="-12" width="24" height="24" rx="6" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.2" />
    <path d="M 6 4 L 10 -2 L 14 2 L 18 -6" fill="none" stroke="#C084FC" stroke-width="1.6" stroke-linecap="round" />
    <text x="34" y="5" class="head-title">Activity &amp; Statistics</text>

    <!-- Filter Toggle: 7D 30D 90D 1Y -->
    <g transform="translate(730, -10)">
      <rect x="0" y="0" width="138" height="22" rx="11" fill="#0E1224" stroke="#252F52" stroke-width="0.8" />
      <text x="18" y="15" class="filter-btn">7D</text>
      <text x="46" y="15" class="filter-btn">30D</text>
      <rect x="68" y="2" width="36" height="18" rx="9" fill="#7C3AED" />
      <text x="86" y="15" class="filter-btn" fill="#FFFFFF" text-anchor="middle">90D</text>
      <text x="120" y="15" class="filter-btn">1Y</text>
    </g>
  </g>

  <!-- Top Row: 3 Metric Boxes -->
  <g transform="translate(24, 46)">
    <!-- 1. Total Contributions -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="276" height="58" class="stat-box" />
      <text x="138" y="20" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#C084FC" text-anchor="middle">&lt;/&gt;</text>
      <text x="138" y="38" class="stat-num" text-anchor="middle">43</text>
      <text x="138" y="50" class="stat-label" text-anchor="middle">Total Contributions</text>
    </g>

    <!-- 2. Current Streak -->
    <g transform="translate(298, 0)">
      <rect x="0" y="0" width="276" height="58" class="stat-box" />
      <text x="138" y="20" font-size="13" text-anchor="middle">🔥</text>
      <text x="138" y="38" class="stat-num" text-anchor="middle">1</text>
      <text x="138" y="50" class="stat-label" text-anchor="middle">Current Streak</text>
    </g>

    <!-- 3. Longest Streak -->
    <g transform="translate(596, 0)">
      <rect x="0" y="0" width="276" height="58" class="stat-box" />
      <text x="138" y="20" font-size="13" text-anchor="middle">⚡</text>
      <text x="138" y="38" class="stat-num" text-anchor="middle">3</text>
      <text x="138" y="50" class="stat-label" text-anchor="middle">Longest Streak</text>
    </g>
  </g>

  <!-- Bottom Row: Chart Card -->
  <g transform="translate(24, 114)">
    <rect x="0" y="0" width="872" height="102" class="stat-box" />

    <!-- Left: Profile Info -->
    <g transform="translate(20, 22)">
      <text x="0" y="0" class="user-name">kiran-embedded (Kiran)</text>

      <g transform="translate(0, 16)">
        <text x="0" y="0" font-size="10">📊</text>
        <text x="16" y="0" class="meta-line">43 Contributions on GitHub</text>
      </g>

      <g transform="translate(0, 32)">
        <text x="0" y="0" font-size="10">📁</text>
        <text x="16" y="0" class="meta-line">18 Public Repos</text>
      </g>

      <g transform="translate(0, 48)">
        <text x="0" y="0" font-size="10">📅</text>
        <text x="16" y="0" class="meta-line">Joined GitHub 11 months ago</text>
      </g>

      <g transform="translate(0, 64)">
        <text x="0" y="0" font-size="10">📍</text>
        <text x="16" y="0" class="meta-line">Thrissur, India</text>
      </g>
    </g>

    <!-- Right: Smooth Purple Glowing Wave Area Chart -->
    <g transform="translate(320, 15)">
      <!-- Wave Area Fill -->
      <path d="M 0 75 Q 50 72 80 55 T 160 52 T 240 50 T 320 30 T 400 55 T 460 20 T 520 75 Z" fill="url(#chartWaveGrad)" />

      <!-- Glowing Wave Stroke -->
      <path d="M 0 75 Q 50 72 80 55 T 160 52 T 240 50 T 320 30 T 400 55 T 460 20 T 520 75" fill="none" stroke="#C084FC" stroke-width="2.5" filter="url(#waveGlow)" />

      <!-- Baseline -->
      <line x1="0" y1="75" x2="520" y2="75" stroke="#1E2746" stroke-width="1" />

      <!-- X-Axis Date Labels -->
      <text x="10" y="88" class="axis-label">7 Oct</text>
      <text x="135" y="88" class="axis-label">14 Oct</text>
      <text x="260" y="88" class="axis-label">21 Oct</text>
      <text x="385" y="88" class="axis-label">28 Oct</text>
      <text x="500" y="88" class="axis-label">4 Nov</text>
    </g>
  </g>
</svg>