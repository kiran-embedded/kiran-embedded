<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 248" width="100%" height="100%">
  <defs>
    <!-- Single-Color Cyber Neon Emerald Gradient Beam -->
    <linearGradient id="chaserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="1">
        <animate attributeName="stop-color" values="#00FF66;#70FF9C;#00FF66" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#00FF66" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#00FF66" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.02" />
    </linearGradient>

    <!-- Monochrome PCB Micro-Grid Pattern -->
    <pattern id="pcbMesh" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0D2418" stroke-width="0.7" opacity="0.65"/>
      <circle cx="0" cy="0" r="1.1" fill="#00FF66" opacity="0.3" />
    </pattern>

    <!-- Intense Emerald Neon Glow Bloom Filter -->
    <filter id="pixelLedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="cardAmbient" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.07" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#04070D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes chasePixelLeds {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -2304; }
    }
    @keyframes pulseLedDiode {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #00FF66); }
      50% { opacity: 0.35; filter: drop-shadow(0 0 2px #00FF66); }
    }

    .card-bg {
      fill: #04070D;
      rx: 14px;
    }
    .led-track {
      fill: none;
      stroke: #0A1C12;
      stroke-width: 3;
      stroke-dasharray: 10 8;
      rx: 14px;
    }
    .led-moving-beam {
      fill: none;
      stroke: url(#chaserGrad);
      stroke-width: 3.2;
      stroke-dasharray: 10 8;
      rx: 14px;
      animation: chasePixelLeds 7s linear infinite;
      filter: url(#pixelLedGlow);
    }
    .panel-box {
      fill: #060B12;
      stroke: #0E2519;
      stroke-width: 1.1;
      rx: 8px;
    }
    .text-title {
      font-family: 'Fira Code', monospace, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #E2E8F0;
      letter-spacing: 2px;
    }
    .text-meta {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #00FF66;
      letter-spacing: 1.2px;
    }
    .col-header {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #00FF66;
      letter-spacing: 1.2px;
    }
    .col-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      fill: #94A3B8;
    }
    .chip-bg {
      fill: #07150F;
      stroke: #0E2E1E;
      stroke-width: 0.8;
      rx: 4px;
    }
    .col-tag {
      font-family: 'Fira Code', monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #00FF66;
      letter-spacing: 0.8px;
    }
    .ribbon-text {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      fill: #64748B;
      letter-spacing: 0.8px;
    }
    .ribbon-highlight {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #00FF66;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Solid Obsidian Background with Single-Color Mesh -->
  <rect x="4" y="4" width="912" height="240" class="card-bg" />
  <rect x="4" y="4" width="912" height="240" fill="url(#pcbMesh)" rx="14" />
  <rect x="4" y="4" width="912" height="240" fill="url(#cardAmbient)" rx="14" />

  <!-- Single-Color Base Pixel LED Strip Track -->
  <rect x="4" y="4" width="912" height="240" class="led-track" />

  <!-- Active Single-Color Neon Emerald Moving Pixel LEDs -->
  <rect x="4" y="4" width="912" height="240" class="led-moving-beam" />

  <!-- Top Header Bar -->
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#00FF66" style="animation: pulseLedDiode 2s ease-in-out infinite;" />
    <circle cx="18" cy="0" r="4" fill="#00FF66" style="animation: pulseLedDiode 2s ease-in-out infinite 0.6s;" />
    <text x="32" y="4" class="text-title">KIRAN EMBEDDED // LOW-LEVEL SYSTEMS &amp; FIRMWARE LAB</text>
    <text x="696" y="4" class="text-meta">[ AVR • XTENSA • ARM64 • LINUX ]</text>
  </g>

  <line x1="24" y1="44" x2="896" y2="44" stroke="#0E2418" stroke-width="1" />

  <!-- 4 Architecture Domains - All Single-Color Neon Green Accents -->
  <!-- 1. Linux Kernel -->
  <g transform="translate(24, 54)">
    <rect x="0" y="0" width="208" height="146" class="panel-box" />
    <rect x="12" y="14" width="3" height="12" rx="1.5" fill="#00FF66" />
    <text x="20" y="24" class="col-header">LINUX KERNEL</text>
    <text x="12" y="49" class="col-body">• Custom Sysfs Nodes</text>
    <text x="12" y="69" class="col-body">• AMOLED DC Dimming</text>
    <text x="12" y="89" class="col-body">• Bypass Charging (0mA)</text>
    <text x="12" y="109" class="col-body">• BadUSB Shield &amp; MGLRU</text>
    <rect x="12" y="122" width="184" height="18" class="chip-bg" />
    <text x="20" y="134" class="col-tag">ARCH: Qualcomm SM6150</text>
  </g>

  <!-- 2. Embedded & IoT -->
  <g transform="translate(244, 54)">
    <rect x="0" y="0" width="208" height="146" class="panel-box" />
    <rect x="12" y="14" width="3" height="12" rx="1.5" fill="#00FF66" />
    <text x="20" y="24" class="col-header">EMBEDDED &amp; IOT</text>
    <text x="12" y="49" class="col-body">• ESP32 &amp; Arduino Uno</text>
    <text x="12" y="69" class="col-body">• I2C / SPI / UART Buses</text>
    <text x="12" y="89" class="col-body">• FreeRTOS Task Loops</text>
    <text x="12" y="109" class="col-body">• Timers &amp; Watchdogs</text>
    <rect x="12" y="122" width="184" height="18" class="chip-bg" />
    <text x="20" y="134" class="col-tag">HW: AVR / Xtensa / ARM</text>
  </g>

  <!-- 3. Flutter & Client UI -->
  <g transform="translate(468, 54)">
    <rect x="0" y="0" width="208" height="146" class="panel-box" />
    <rect x="12" y="14" width="3" height="12" rx="1.5" fill="#00FF66" />
    <text x="20" y="24" class="col-header">FLUTTER &amp; CLIENT</text>
    <text x="12" y="49" class="col-body">• Cross-Platform Dashboards</text>
    <text x="12" y="69" class="col-body">• Android SystemUI Tiles</text>
    <text x="12" y="89" class="col-body">• Real-Time Telemetry Sync</text>
    <text x="12" y="109" class="col-body">• Native JNI Driver Interop</text>
    <rect x="12" y="122" width="184" height="18" class="chip-bg" />
    <text x="20" y="134" class="col-tag">STACK: Flutter / Android</text>
  </g>

  <!-- 4. Audio & Signal DSP -->
  <g transform="translate(692, 54)">
    <rect x="0" y="0" width="208" height="146" class="panel-box" />
    <rect x="12" y="14" width="3" height="12" rx="1.5" fill="#00FF66" />
    <text x="20" y="24" class="col-header">AUDIO &amp; SIGNAL DSP</text>
    <text x="12" y="49" class="col-body">• Microphone HPF Filters</text>
    <text x="12" y="69" class="col-body">• 40ms Fast Unmute Ramp</text>
    <text x="12" y="89" class="col-body">• Direct ALSA Codec Path</text>
    <text x="12" y="109" class="col-body">• Real-Time Speech Focus</text>
    <rect x="12" y="122" width="184" height="18" class="chip-bg" />
    <text x="20" y="134" class="col-tag">AUDIO: ALSA / DSP / HAL</text>
  </g>

  <!-- Bottom Hardware Status Ribbon -->
  <g transform="translate(24, 224)">
    <circle cx="5" cy="-3" r="3.2" fill="#00FF66" style="animation: pulseLedDiode 1.8s ease-in-out infinite;" />
    <text x="16" y="0" class="ribbon-highlight">SYSTEM: ONLINE</text>
    <text x="156" y="0" class="ribbon-text">KERNEL: 4.14.357-AETHER</text>
    <text x="360" y="0" class="ribbon-text">TARGETS: ESP32 • ARDUINO UNO • SM6150</text>
    <text x="736" y="0" class="ribbon-highlight">BUILD: CLEAN (VERIFIED)</text>
  </g>
</svg>