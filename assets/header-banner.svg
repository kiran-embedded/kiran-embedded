<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Space & Nebula Gradients -->
    <linearGradient id="skyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#04060E" />
      <stop offset="45%" stop-color="#0A0E23" />
      <stop offset="80%" stop-color="#140E2F" />
      <stop offset="100%" stop-color="#080614" />
    </linearGradient>

    <!-- Planetary Horizon Arc Gradient -->
    <radialGradient id="planetGlow" cx="50%" cy="-30%" r="90%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="65%" stop-color="#4C1D95" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#04060E" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient (Razor Sharp White to Light Lilac) -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Glow for Lines -->
    <filter id="arcGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePlanet {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }
    .banner-subhead {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #C084FC;
      letter-spacing: 4px;
    }
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 800;
      fill: url(#titleGrad);
      letter-spacing: 1px;
      filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.45));
    }
    .banner-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.8px;
    }
    .icon-circle {
      fill: #0E0D22;
      stroke: #33245C;
      stroke-width: 1.2;
    }
  </style>

  <!-- Sky & Space Background -->
  <rect x="0" y="0" width="920" height="270" rx="14" fill="url(#skyGrad)" />

  <!-- Stars Background -->
  <g fill="#FFFFFF">
    <circle cx="85" cy="45" r="1.1" opacity="0.6" style="animation: starTwinkle 3s infinite 0.2s;" />
    <circle cx="160" cy="80" r="1.3" opacity="0.8" style="animation: starTwinkle 4s infinite 1.1s;" />
    <circle cx="230" cy="30" r="0.9" opacity="0.5" />
    <circle cx="310" cy="65" r="1.2" opacity="0.7" style="animation: starTwinkle 3.5s infinite 0.7s;" />
    <circle cx="420" cy="25" r="1.4" opacity="0.9" />
    <circle cx="530" cy="50" r="1.1" opacity="0.6" style="animation: starTwinkle 4.5s infinite 2s;" />
    <circle cx="640" cy="35" r="1.3" opacity="0.8" />
    <circle cx="720" cy="75" r="0.9" opacity="0.5" style="animation: starTwinkle 3.2s infinite 1.4s;" />
    <circle cx="810" cy="40" r="1.2" opacity="0.7" />
    <circle cx="875" cy="85" r="1" opacity="0.6" style="animation: starTwinkle 5s infinite 0.5s;" />
  </g>

  <!-- Planetary Celestial Arc & Top Horizon Glow -->
  <rect x="0" y="0" width="920" height="270" rx="14" fill="url(#planetGlow)" style="animation: pulsePlanet 6s ease-in-out infinite;" />
  <path d="M 120 0 Q 460 70 800 0" fill="none" stroke="#C084FC" stroke-width="2.2" opacity="0.75" filter="url(#arcGlow)" />
  <path d="M 220 0 Q 460 50 700 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />

  <!-- Mountain Silhouettes at Bottom -->
  <path d="M 0 270 L 0 220 L 70 195 L 150 215 L 230 180 L 310 205 L 390 170 L 460 190 L 540 165 L 620 200 L 710 175 L 800 210 L 870 185 L 920 210 L 920 270 Z" fill="#0E0A22" opacity="0.85" />
  <path d="M 0 270 L 0 235 L 90 215 L 190 230 L 290 205 L 390 225 L 480 200 L 570 220 L 670 195 L 770 225 L 860 205 L 920 225 L 920 270 Z" fill="#070512" />

  <!-- Header Center Frame -->
  <g transform="translate(460, 68)" text-anchor="middle">
    <!-- Futuristic Bracket Lines -->
    <path d="M -230 18 L -265 18 L -285 36" fill="none" stroke="#A855F7" stroke-width="1.8" filter="url(#arcGlow)" opacity="0.85" />
    <path d="M 230 18 L 265 18 L 285 36" fill="none" stroke="#A855F7" stroke-width="1.8" filter="url(#arcGlow)" opacity="0.85" />

    <!-- Subtitle Track -->
    <text y="0" class="banner-subhead">K I R A N   E M B E D D E D</text>

    <!-- Main Title -->
    <text y="36" class="banner-title">
      Systems <tspan fill="#A855F7">•</tspan> Kernel <tspan fill="#A855F7">•</tspan> Firmware <tspan fill="#A855F7">•</tspan> Embedded
    </text>

    <!-- Tagline -->
    <text y="62" class="banner-tagline">Low-Level Systems Developer &amp; Firmware Enthusiast</text>
  </g>

  <!-- 5 Circular Badge Icons Row -->
  <g transform="translate(460, 195)" text-anchor="middle">
    <!-- 1. Linux Penguin -->
    <g transform="translate(-112, 0)">
      <circle cx="0" cy="0" r="18" class="icon-circle" />
      <path d="M -5 -7 C -5 -11 5 -11 5 -7 C 5 -4 7 -2 7 2 C 7 6 5 8 5 8 C 7 9 7 11 5 11 L -5 11 C -7 11 -7 9 -5 8 C -5 8 -7 6 -7 2 C -7 -2 -5 -4 -5 -7 Z" fill="#E2E8F0" />
      <ellipse cx="0" cy="2" rx="4" ry="5.5" fill="#0F0E24" />
      <polygon points="-2,-4 0,-2 2,-4 0,-5" fill="#F59E0B" />
      <circle cx="-2" cy="-7" r="0.8" fill="#0F0E24" />
      <circle cx="2" cy="-7" r="0.8" fill="#0F0E24" />
    </g>

    <!-- 2. Android Bugdroid -->
    <g transform="translate(-56, 0)">
      <circle cx="0" cy="0" r="18" class="icon-circle" />
      <path d="M -8 -1 A 8 8 0 0 1 8 -1 Z" fill="#3DDC84" />
      <line x1="-5" y1="-7" x2="-7" y2="-10" stroke="#3DDC84" stroke-width="1.2" stroke-linecap="round" />
      <line x1="5" y1="-7" x2="7" y2="-10" stroke="#3DDC84" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="-3" cy="-4" r="1" fill="#0F0E24" />
      <circle cx="3" cy="-4" r="1" fill="#0F0E24" />
      <rect x="-8" y="1" width="16" height="8.5" rx="1.5" fill="#3DDC84" />
      <line x1="-10" y1="2" x2="-10" y2="7.5" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round" />
      <line x1="10" y1="2" x2="10" y2="7.5" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- 3. Microchip / CPU -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="18" class="icon-circle" />
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#38BDF8" opacity="0.9" />
      <rect x="-5" y="-5" width="10" height="10" rx="1" fill="#0F0E24" />
      <line x1="-5" y1="-10" x2="-5" y2="-8" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="0" y1="-10" x2="0" y2="-8" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="5" y1="-10" x2="5" y2="-8" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="-5" y1="8" x2="-5" y2="10" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="0" y1="8" x2="0" y2="10" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="5" y1="8" x2="5" y2="10" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="-10" y1="-5" x2="-8" y2="-5" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="-10" y1="0" x2="-8" y2="0" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="-10" y1="5" x2="-8" y2="5" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="8" y1="-5" x2="10" y2="-5" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="8" y1="0" x2="10" y2="0" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="8" y1="5" x2="10" y2="5" stroke="#38BDF8" stroke-width="1.2" />
    </g>

    <!-- 4. Code </> -->
    <g transform="translate(56, 0)">
      <circle cx="0" cy="0" r="18" class="icon-circle" />
      <path d="M -6 -4 L -9 0 L -6 4" fill="none" stroke="#A855F7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-1" y1="5" x2="1" y2="-5" stroke="#A855F7" stroke-width="1.6" stroke-linecap="round" />
      <path d="M 6 -4 L 9 0 L 6 4" fill="none" stroke="#A855F7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 5. Integrated Circuit / Transistor -->
    <g transform="translate(112, 0)">
      <circle cx="0" cy="0" r="18" class="icon-circle" />
      <circle cx="0" cy="0" r="5" fill="none" stroke="#C084FC" stroke-width="1.4" />
      <line x1="-9" y1="0" x2="-5" y2="0" stroke="#C084FC" stroke-width="1.3" />
      <line x1="5" y1="0" x2="9" y2="0" stroke="#C084FC" stroke-width="1.3" />
      <line x1="0" y1="-9" x2="0" y2="-5" stroke="#C084FC" stroke-width="1.3" />
      <line x1="0" y1="5" x2="0" y2="9" stroke="#C084FC" stroke-width="1.3" />
      <circle cx="0" cy="0" r="1.8" fill="#00FF66" />
    </g>
  </g>
</svg>