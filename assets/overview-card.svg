<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 216" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2E2054" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A1838" stop-opacity="0.2" />
    </linearGradient>

    <!-- Top Left Accent Glow -->
    <radialGradient id="topGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0B0E1E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .card-bg {
      fill: #0B0E1E;
      stroke: url(#cardBorder);
      stroke-width: 1.2;
      rx: 12px;
    }
    .head-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .intro-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      fill: #94A3B8;
      letter-spacing: 0.2px;
    }
    .bullet-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #C084FC;
    }
    .bullet-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      fill: #E2E8F0;
    }
    .icon-badge {
      fill: #1A1538;
      stroke: #3B2A6B;
      stroke-width: 1;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="212" class="card-bg" />
  <rect x="2" y="2" width="916" height="212" rx="12" fill="url(#topGlow)" />

  <!-- Header -->
  <g transform="translate(24, 28)">
    <rect x="0" y="-12" width="24" height="24" rx="6" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.2" />
    <path d="M 13 -6 L 9 0 L 14 0 L 11 6" fill="none" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="34" y="5" class="head-title">Overview</text>
    <circle cx="866" cy="0" r="7.5" fill="none" stroke="#475569" stroke-width="1.2" />
    <text x="866" y="3.5" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">i</text>
  </g>

  <!-- Intro Line -->
  <text x="24" y="56" class="intro-text">Low-level systems and embedded code across Linux kernel drivers, microcontroller firmware, and Flutter apps.</text>

  <!-- 4 Bullets: Real Projects Only -->
  <!-- 1. AETHER Kernel -->
  <g transform="translate(24, 80)">
    <circle cx="9" cy="0" r="9" class="icon-badge" />
    <text x="9" y="3.5" font-size="10" text-anchor="middle">🐧</text>
    <text x="26" y="3.5">
      <tspan class="bullet-title">AETHER Kernel:</tspan>
      <tspan class="bullet-desc"> Linux 4.14 kernel for Xiaomi Redmi Note 10 (</tspan><tspan font-weight="600" fill="#38BDF8">mojito</tspan><tspan class="bullet-desc"> / SM6150) with AMOLED DC Dimming, Sunlight HBM, and BadUSB data shield.</tspan>
    </text>
  </g>

  <!-- 2. ESP32 & Arduino Uno -->
  <g transform="translate(24, 110)">
    <circle cx="9" cy="0" r="9" class="icon-badge" />
    <text x="9" y="3.5" font-size="10" text-anchor="middle">🔌</text>
    <text x="26" y="3.5">
      <tspan class="bullet-title">ESP32 &amp; Arduino Uno (Nebula):</tspan>
      <tspan class="bullet-desc"> Microcontroller firmware for Firebase smart lighting and real-time sensor control.</tspan>
    </text>
  </g>

  <!-- 3. Flutter & Dart Apps -->
  <g transform="translate(24, 140)">
    <circle cx="9" cy="0" r="9" class="icon-badge" />
    <text x="9" y="3.5" font-size="10" text-anchor="middle">📱</text>
    <text x="26" y="3.5">
      <tspan class="bullet-title">Flutter Apps (VowNote / Aurexa):</tspan>
      <tspan class="bullet-desc"> Note-taking and hardware control apps with clean Material You UI and cloud sync.</tspan>
    </text>
  </g>

  <!-- 4. MicFix & Audio Routing -->
  <g transform="translate(24, 170)">
    <circle cx="9" cy="0" r="9" class="icon-badge" />
    <text x="9" y="3.5" font-size="10" text-anchor="middle">🎧</text>
    <text x="26" y="3.5">
      <tspan class="bullet-title">MicFix &amp; Audio Routing:</tspan>
      <tspan class="bullet-desc"> KernelSU / Magisk module fixing call microphone audio and direct ALSA routing.</tspan>
    </text>
  </g>
</svg>
