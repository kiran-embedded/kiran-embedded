<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="stackBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2E2054" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A1838" stop-opacity="0.2" />
    </linearGradient>

    <!-- Isometric Chip Glow Filter -->
    <filter id="chipNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
  </defs>

  <style>
    .card-bg {
      fill: #0B0E1E;
      stroke: url(#stackBorder);
      stroke-width: 1.2;
      rx: 12px;
    }
    .head-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .cat-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #E2E8F0;
      letter-spacing: 0.3px;
    }
    .badge-bg {
      rx: 5px;
      stroke-width: 0.9;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="246" class="card-bg" />

  <!-- Header -->
  <g transform="translate(24, 28)">
    <rect x="0" y="-12" width="24" height="24" rx="6" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.2" />
    <path d="M 6 -2 L 10 -6 L 14 -2 L 18 -6" fill="none" stroke="#C084FC" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="12" cy="4" r="2.5" fill="none" stroke="#C084FC" stroke-width="1.4" />
    <text x="34" y="5" class="head-title">Tech Stack</text>
  </g>

  <!-- Left Side: 3D Isometric Microprocessor Illustration -->
  <g transform="translate(85, 135)">
    <!-- Circuit Bus Lines Radiating Out -->
    <path d="M -50 -25 L -80 -40 L -100 -40" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.6" />
    <path d="M -50 25 L -80 40 L -100 40" fill="none" stroke="#A855F7" stroke-width="1.2" opacity="0.6" />
    <path d="M 50 -25 L 80 -40 L 100 -40" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.6" />
    <path d="M 50 25 L 80 40 L 100 40" fill="none" stroke="#A855F7" stroke-width="1.2" opacity="0.6" />
    <circle cx="-100" cy="-40" r="2" fill="#00E5FF" />
    <circle cx="-100" cy="40" r="2" fill="#A855F7" />
    <circle cx="100" cy="-40" r="2" fill="#00E5FF" />
    <circle cx="100" cy="40" r="2" fill="#A855F7" />

    <!-- Isometric Chip Layers -->
    <polygon points="0,48 55,20 0,-8 -55,20" fill="#060912" opacity="0.8" />
    <polygon points="0,42 55,14 55,8 0,36 -55,8 -55,14" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" />
    <polygon points="0,36 55,8 0,-20 -55,8" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.2" filter="url(#chipNeon)" />
    <polygon points="0,26 38,6 0,-14 -38,6" fill="url(#chipGrad)" opacity="0.85" />
    <polygon points="0,18 24,5 0,-8 -24,5" fill="#0F0E24" stroke="#00E5FF" stroke-width="1.2" />
    <circle cx="0" cy="5" r="3" fill="#00FF66" style="filter: drop-shadow(0 0 4px #00FF66);" />

    <!-- Isometric Pins -->
    <line x1="-45" y1="13" x2="-52" y2="17" stroke="#00E5FF" stroke-width="1.8" />
    <line x1="-30" y1="21" x2="-37" y2="25" stroke="#00E5FF" stroke-width="1.8" />
    <line x1="-15" y1="29" x2="-22" y2="33" stroke="#00E5FF" stroke-width="1.8" />
    <line x1="45" y1="13" x2="52" y2="17" stroke="#A855F7" stroke-width="1.8" />
    <line x1="30" y1="21" x2="37" y2="25" stroke="#A855F7" stroke-width="1.8" />
    <line x1="15" y1="29" x2="22" y2="33" stroke="#A855F7" stroke-width="1.8" />
  </g>

  <!-- Right Side: 4 Grouped Pill Badges (Simple, Authentic Words) -->
  <g transform="translate(230, 48)">
    <!-- 1. Languages & Tools -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="cat-title">Languages &amp; Tools</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="38" height="20" class="badge-bg" fill="#0B1A2E" stroke="#00599C" />
        <text x="19" y="14" class="badge-text" fill="#38BDF8" text-anchor="middle">C</text>

        <rect x="44" y="0" width="46" height="20" class="badge-bg" fill="#0B1A2E" stroke="#004482" />
        <text x="67" y="14" class="badge-text" fill="#38BDF8" text-anchor="middle">C++</text>

        <rect x="96" y="0" width="50" height="20" class="badge-bg" fill="#0B1C30" stroke="#0175C2" />
        <text x="121" y="14" class="badge-text" fill="#60A5FA" text-anchor="middle">Dart</text>

        <rect x="152" y="0" width="50" height="20" class="badge-bg" fill="#2E1810" stroke="#DEA584" />
        <text x="177" y="14" class="badge-text" fill="#FDBA74" text-anchor="middle">Rust</text>

        <rect x="208" y="0" width="60" height="20" class="badge-bg" fill="#0D2235" stroke="#3776AB" />
        <text x="238" y="14" class="badge-text" fill="#93C5FD" text-anchor="middle">Python</text>

        <rect x="274" y="0" width="52" height="20" class="badge-bg" fill="#132B18" stroke="#4EAA25" />
        <text x="300" y="14" class="badge-text" fill="#86EFAC" text-anchor="middle">Bash</text>
      </g>
    </g>

    <!-- 2. Mobile Apps & UI -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" class="cat-title">Mobile Apps &amp; UI</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="62" height="20" class="badge-bg" fill="#0A223B" stroke="#02569B" />
        <text x="31" y="14" class="badge-text" fill="#38BDF8" text-anchor="middle">Flutter</text>

        <rect x="68" y="0" width="134" height="20" class="badge-bg" fill="#0D281C" stroke="#3DDC84" />
        <text x="135" y="14" class="badge-text" fill="#4ADE80" text-anchor="middle">Android (AOSP 11–17)</text>

        <rect x="208" y="0" width="70" height="20" class="badge-bg" fill="#2E200B" stroke="#FFCA28" />
        <text x="243" y="14" class="badge-text" fill="#FDE047" text-anchor="middle">Firebase</text>

        <rect x="284" y="0" width="94" height="20" class="badge-bg" fill="#0A2536" stroke="#00D4FF" />
        <text x="331" y="14" class="badge-text" fill="#38BDF8" text-anchor="middle">Material UI</text>
      </g>
    </g>

    <!-- 3. Linux Kernel & Drivers -->
    <g transform="translate(0, 96)">
      <text x="0" y="0" class="cat-title">Linux Kernel &amp; Drivers</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="138" height="20" class="badge-bg" fill="#292209" stroke="#FCC624" />
        <text x="69" y="14" class="badge-text" fill="#FDE047" text-anchor="middle">Linux Kernel (4.14 / 5.x)</text>

        <rect x="144" y="0" width="134" height="20" class="badge-bg" fill="#2E0E12" stroke="#E60012" />
        <text x="211" y="14" class="badge-text" fill="#F87171" text-anchor="middle">Qualcomm Techpack</text>

        <rect x="284" y="0" width="112" height="20" class="badge-bg" fill="#23143D" stroke="#673AB7" />
        <text x="340" y="14" class="badge-text" fill="#C084FC" text-anchor="middle">KernelSU-Next</text>

        <rect x="402" y="0" width="98" height="20" class="badge-bg" fill="#0C2B1D" stroke="#10B981" />
        <text x="451" y="14" class="badge-text" fill="#34D399" text-anchor="middle">SuSFS v2.3.0</text>
      </g>
    </g>

    <!-- 4. Microcontrollers & Hardware -->
    <g transform="translate(0, 144)">
      <text x="0" y="0" class="cat-title">Microcontrollers &amp; Hardware</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="90" height="20" class="badge-bg" fill="#082426" stroke="#00979D" />
        <text x="45" y="14" class="badge-text" fill="#2DD4BF" text-anchor="middle">Arduino Uno</text>

        <rect x="96" y="0" width="110" height="20" class="badge-bg" fill="#2E1111" stroke="#E7352C" />
        <text x="151" y="14" class="badge-text" fill="#F87171" text-anchor="middle">ESP32 / ESP8266</text>

        <rect x="212" y="0" width="104" height="20" class="badge-bg" fill="#09212D" stroke="#0091BD" />
        <text x="264" y="14" class="badge-text" fill="#38BDF8" text-anchor="middle">ARM Cortex-M</text>

        <rect x="322" y="0" width="114" height="20" class="badge-bg" fill="#0A2736" stroke="#00D4FF" />
        <text x="379" y="14" class="badge-text" fill="#38BDF8" text-anchor="middle">I2C / SPI / UART</text>

        <rect x="442" y="0" width="118" height="20" class="badge-bg" fill="#1A2233" stroke="#64748B" />
        <text x="501" y="14" class="badge-text" fill="#CBD5E1" text-anchor="middle">GPIO / PWM / ADC</text>
      </g>
    </g>
  </g>
</svg>
