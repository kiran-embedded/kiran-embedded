<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <!-- Border Gradient: Neon Purple to Electric Cyan -->
    <linearGradient id="termBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Terminal Ambient Glow -->
    <filter id="termGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="greenNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseActiveGreen {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00FF66); }
      50% { opacity: 0.4; filter: none; }
    }
    .term-window {
      fill: #080B18;
      stroke: url(#termBorderGrad);
      stroke-width: 1.6;
      rx: 12px;
    }
    .term-title {
      font-family: 'Fira Code', monospace;
      font-size: 11.5px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .ascii-text {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      line-height: 1.1;
      font-weight: 700;
      fill: #00FF66;
      letter-spacing: -0.5px;
    }
    .term-sub {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #00FF66;
      letter-spacing: 2px;
    }
    .info-label {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      fill: #64748B;
    }
    .info-val {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .info-active {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #00FF66;
    }
    .prompt-text {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #C084FC;
      letter-spacing: 0.5px;
    }
    .cursor {
      fill: #C084FC;
      animation: blinkCursor 1s infinite;
    }
  </style>

  <!-- Terminal Window Background & Glowing Border -->
  <rect x="3" y="3" width="914" height="224" class="term-window" filter="url(#termGlow)" />

  <!-- Top Title Bar -->
  <g transform="translate(18, 18)">
    <circle cx="6" cy="0" r="4.5" fill="#FF5F56" />
    <circle cx="22" cy="0" r="4.5" fill="#FFBD2E" />
    <circle cx="38" cy="0" r="4.5" fill="#27C93F" />
    <text x="442" y="4" text-anchor="middle" class="term-title">kiran-embedded@README: ~</text>
  </g>

  <line x1="4" y1="34" x2="916" y2="34" stroke="#161D36" stroke-width="1" />

  <!-- Left: ASCII Matrix Green Logo -->
  <g transform="translate(24, 48)">
    <text x="0" y="16" class="ascii-text" filter="url(#greenNeon)"> █████╗ ███████╗████████╗██╗  ██╗███████╗██████╗ </text>
    <text x="0" y="27" class="ascii-text" filter="url(#greenNeon)">██╔══██╗██╔════╝╚══██╔══╝██║  ██║██╔════╝██╔══██╗</text>
    <text x="0" y="38" class="ascii-text" filter="url(#greenNeon)">███████║█████╗     ██║   ███████║█████╗  ██████╔╝</text>
    <text x="0" y="49" class="ascii-text" filter="url(#greenNeon)">██╔══██║██╔══╝     ██║   ██╔══██║██╔══╝  ██╔══██╗</text>
    <text x="0" y="60" class="ascii-text" filter="url(#greenNeon)">██║  ██║███████╗   ██║   ██║  ██║███████╗██║  ██║</text>
    <text x="0" y="71" class="ascii-text" filter="url(#greenNeon)">╚═╝  ╚═╝╚══════╝   ╚═╝   ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝</text>
    <text x="2" y="92" class="term-sub" filter="url(#greenNeon)">KIRAN EMBEDDED // LOW-LEVEL SYSTEMS LAB</text>
  </g>

  <!-- Right: System Info Telemetry -->
  <g transform="translate(530, 60)">
    <!-- Row 1: Kernel -->
    <g transform="translate(0, 0)">
      <circle cx="8" cy="0" r="2.5" fill="#00FF66" />
      <text x="20" y="4" class="info-label">Kernel</text>
      <text x="86" y="4" class="info-label">:</text>
      <text x="104" y="4" class="info-val">AETHER v1.8.1</text>
    </g>

    <!-- Row 2: Platform -->
    <g transform="translate(0, 24)">
      <circle cx="8" cy="0" r="2.5" fill="#00FF66" />
      <text x="20" y="4" class="info-label">Platform</text>
      <text x="86" y="4" class="info-label">:</text>
      <text x="104" y="4" class="info-val">Qualcomm SM6150</text>
    </g>

    <!-- Row 3: Focus -->
    <g transform="translate(0, 48)">
      <circle cx="8" cy="0" r="2.5" fill="#00FF66" />
      <text x="20" y="4" class="info-label">Focus</text>
      <text x="86" y="4" class="info-label">:</text>
      <text x="104" y="4" class="info-val">Kernel • Firmware • IoT • DSP</text>
    </g>

    <!-- Row 4: Status -->
    <g transform="translate(0, 72)">
      <circle cx="8" cy="0" r="4" fill="#00FF66" style="animation: pulseActiveGreen 2s ease-in-out infinite;" />
      <text x="20" y="4" class="info-label">Status</text>
      <text x="86" y="4" class="info-label">:</text>
      <text x="104" y="4" class="info-active">● Active</text>
    </g>
  </g>

  <line x1="24" y1="172" x2="896" y2="172" stroke="#161D36" stroke-width="1" />

  <!-- Bottom Command Prompt Line -->
  <g transform="translate(26, 198)">
    <text x="0" y="0" class="prompt-text">&gt; Real-Time Audio DSP, ALSA Routing &amp; Hardware</text>
    <rect x="360" y="-10" width="8" height="13" class="cursor" />
  </g>
</svg>