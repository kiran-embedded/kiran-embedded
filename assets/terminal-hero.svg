<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="100%">
  <defs>
    <!-- Border Gradient: Neon Purple to Electric Cyan with Color Cycle -->
    <linearGradient id="termBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#00E5FF;#A855F7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#A855F7;#00E5FF" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Matrix Horizontal Scanlines Pattern -->
    <pattern id="matrixScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00FF66" stroke-width="0.8" opacity="0.3" />
    </pattern>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="scanLaserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="30%" stop-color="#70FF9C" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#00FF66" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Beam Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termBorderPulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(0, 229, 255, 0.5)); }
    }
    @keyframes aetherGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 255, 102, 0.8)) drop-shadow(0 0 10px rgba(0, 255, 102, 0.35)); }
      50% { filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.95)) drop-shadow(0 0 16px rgba(0, 255, 102, 0.5)); }
    }
    @keyframes laserSweep {
      0% { transform: translateY(-5px); opacity: 0; }
      15% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translateY(58px); opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseActiveGreen {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00FF66); }
      50% { opacity: 0.4; filter: none; }
    }
    @keyframes hudPulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00E5FF); }
    }

    .term-window {
      fill: #080B18;
      stroke: url(#termBorderGrad);
      stroke-width: 1.6;
      rx: 12px;
      animation: termBorderPulse 6s ease-in-out infinite;
    }
    .term-title {
      font-family: 'Fira Code', 'SF Mono', monospace;
      font-size: 11.5px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .aether-matrix-base {
      fill: #04120A;
      stroke: #00FF66;
      stroke-width: 2.2;
      stroke-linejoin: round;
      animation: aetherGlowPulse 3.5s ease-in-out infinite;
    }
    .aether-matrix-core {
      fill: none;
      stroke: #70FF9C;
      stroke-width: 0.8;
      opacity: 0.85;
    }
    .term-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #00FF66;
      letter-spacing: 1.5px;
    }
    .hud-bracket {
      fill: none;
      stroke: #00E5FF;
      stroke-width: 1.5;
      animation: hudPulse 3s ease-in-out infinite;
    }
    .info-panel {
      fill: #0B0E20;
      stroke: #182240;
      stroke-width: 1;
      rx: 8px;
    }
    .info-label {
      font-family: 'Fira Code', 'SF Mono', monospace;
      font-size: 11.5px;
      fill: #64748B;
    }
    .info-val {
      font-family: 'Fira Code', 'SF Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .info-active {
      font-family: 'Fira Code', 'SF Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #00FF66;
    }
    .prompt-text {
      font-family: 'Fira Code', 'SF Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #C084FC;
      letter-spacing: 0.5px;
    }
    .cursor {
      fill: #C084FC;
      animation: blinkCursor 1s infinite;
    }
  </style>

  <!-- Terminal Window Background & Animated Border -->
  <rect x="3" y="3" width="874" height="244" class="term-window" />

  <!-- Top Title Bar -->
  <g transform="translate(18, 18)">
    <circle cx="6" cy="0" r="4.5" fill="#FF5F56" />
    <circle cx="22" cy="0" r="4.5" fill="#FFBD2E" />
    <circle cx="38" cy="0" r="4.5" fill="#27C93F" />
    <text x="422" y="4" text-anchor="middle" class="term-title">kiran-embedded@README: ~</text>
  </g>

  <line x1="4" y1="34" x2="876" y2="34" stroke="#161D36" stroke-width="1" />

  <!-- Left: Matrix Cyber AETHER Logo with Scanlines & Laser Sweep -->
  <g transform="translate(36, 52)">
    <!-- Corner HUD Targeting Brackets -->
    <path d="M -12 2 L -12 -6 L -4 -6" class="hud-bracket" />
    <path d="M 330 -6 L 338 -6 L 338 2" class="hud-bracket" />
    <path d="M -12 48 L -12 56 L -4 56" class="hud-bracket" />
    <path d="M 330 56 L 338 56 L 338 48" class="hud-bracket" />

    <!-- Matrix Stencil Glyphs for A E T H E R (Hollow Double-Line Cyber Aesthetic) -->
    <g class="aether-matrix-base">
      <!-- Letter A -->
      <path d="M 0,50 L 15,0 L 27,0 L 42,50 L 32,50 L 27,32 L 15,32 L 10,50 Z M 17,23 L 25,23 L 21,10 Z" />
      <!-- Letter E -->
      <path d="M 56,0 L 98,0 L 98,10 L 68,10 L 68,20 L 93,20 L 93,30 L 68,30 L 68,40 L 98,40 L 98,50 L 56,50 Z" />
      <!-- Letter T -->
      <path d="M 112,0 L 154,0 L 154,10 L 139,10 L 139,50 L 127,50 L 127,10 L 112,10 Z" />
      <!-- Letter H -->
      <path d="M 168,0 L 180,0 L 180,20 L 198,20 L 198,0 L 210,0 L 210,50 L 198,50 L 198,30 L 180,30 L 180,50 L 168,50 Z" />
      <!-- Letter E -->
      <path d="M 224,0 L 266,0 L 266,10 L 236,10 L 236,20 L 261,20 L 261,30 L 236,30 L 236,40 L 266,40 L 266,50 L 224,50 Z" />
      <!-- Letter R -->
      <path d="M 280,0 L 312,0 C 319,0 322,3 322,9 L 322,19 C 322,25 318,28 310,29 L 322,50 L 309,50 L 299,30 L 292,30 L 292,50 L 280,50 Z M 292,10 L 292,20 L 309,20 C 311,20 312,19 312,17 L 312,13 C 312,11 311,10 309,10 Z" />
    </g>

    <!-- Matrix Internal Raster Scanline Overlay -->
    <g fill="url(#matrixScan)" opacity="0.45">
      <path d="M 0,50 L 15,0 L 27,0 L 42,50 L 32,50 L 27,32 L 15,32 L 10,50 Z M 17,23 L 25,23 L 21,10 Z" />
      <path d="M 56,0 L 98,0 L 98,10 L 68,10 L 68,20 L 93,20 L 93,30 L 68,30 L 68,40 L 98,40 L 98,50 L 56,50 Z" />
      <path d="M 112,0 L 154,0 L 154,10 L 139,10 L 139,50 L 127,50 L 127,10 L 112,10 Z" />
      <path d="M 168,0 L 180,0 L 180,20 L 198,20 L 198,0 L 210,0 L 210,50 L 198,50 L 198,30 L 180,30 L 180,50 L 168,50 Z" />
      <path d="M 224,0 L 266,0 L 266,10 L 236,10 L 236,20 L 261,20 L 261,30 L 236,30 L 236,40 L 266,40 L 266,50 L 224,50 Z" />
      <path d="M 280,0 L 312,0 C 319,0 322,3 322,9 L 322,19 C 322,25 318,28 310,29 L 322,50 L 309,50 L 299,30 L 292,30 L 292,50 L 280,50 Z M 292,10 L 292,20 L 309,20 C 311,20 312,19 312,17 L 312,13 C 312,11 311,10 309,10 Z" />
    </g>

    <!-- Inner Core Hairline -->
    <g class="aether-matrix-core">
      <path d="M 3,47 L 17,4 L 25,4 L 39,47" />
      <path d="M 59,3 L 95,3 L 95,7 L 71,7 L 71,23 L 90,23 L 90,27 L 71,27 L 71,43 L 95,43 L 95,47 L 59,47 Z" />
      <path d="M 115,3 L 151,3 L 151,7 L 136,7 L 136,47 L 130,47 L 130,7 L 115,7 Z" />
      <path d="M 171,3 L 177,3 L 177,23 L 201,23 L 201,3 L 207,3 L 207,47 L 201,47 L 201,27 L 177,27 L 177,47 L 171,47 Z" />
      <path d="M 227,3 L 263,3 L 263,7 L 239,7 L 239,23 L 258,23 L 258,27 L 239,27 L 239,43 L 263,43 L 263,47 L 227,47 Z" />
    </g>

    <!-- Animated Holographic Scanning Beam -->
    <g style="animation: laserSweep 3s ease-in-out infinite;">
      <line x1="-12" y1="0" x2="334" y2="0" stroke="url(#scanLaserGrad)" stroke-width="2.5" filter="url(#laserGlow)" />
    </g>

    <!-- Subtitle (Row 1 - Clean & Free of Overlap) -->
    <g transform="translate(0, 78)">
      <circle cx="4" cy="-4" r="3.2" fill="#00FF66" style="animation: pulseActiveGreen 1.8s infinite;" />
      <text x="16" y="0" class="term-sub">KIRAN EMBEDDED // LOW-LEVEL SYSTEMS LAB</text>
    </g>

    <!-- Enclosed Hardware Chip Tags (Row 2 - Zero Overlap Guaranteed) -->
    <g transform="translate(0, 98)">
      <rect x="0" y="-11" width="108" height="17" rx="4" fill="#0A1D13" stroke="#00FF66" stroke-width="0.9" />
      <text x="54" y="2" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#70FF9C" text-anchor="middle">SM6150 // RING-0</text>

      <rect x="116" y="-11" width="88" height="17" rx="4" fill="#0B1626" stroke="#38BDF8" stroke-width="0.9" />
      <text x="160" y="2" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#38BDF8" text-anchor="middle">ARM64 ARCH</text>

      <rect x="212" y="-11" width="84" height="17" rx="4" fill="#18112E" stroke="#A855F7" stroke-width="0.9" />
      <text x="254" y="2" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#C084FC" text-anchor="middle">QUALCOMM</text>
    </g>
  </g>

  <!-- Right: System Info Telemetry Panel (Mobile-Scaled & Crisp) -->
  <g transform="translate(450, 48)">
    <rect x="0" y="0" width="400" height="124" class="info-panel" />

    <g transform="translate(20, 24)">
      <!-- Row 1: Kernel -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="0" r="2.8" fill="#00FF66" />
        <text x="18" y="4" class="info-label">Kernel</text>
        <text x="82" y="4" class="info-label">:</text>
        <text x="98" y="4" class="info-val">AETHER v1.8 (SM6150 / mojito)</text>
      </g>

      <!-- Row 2: Firmware -->
      <g transform="translate(0, 24)">
        <circle cx="6" cy="0" r="2.8" fill="#00FF66" />
        <text x="18" y="4" class="info-label">Firmware</text>
        <text x="82" y="4" class="info-label">:</text>
        <text x="98" y="4" class="info-val">ESP32 • Arduino Uno (Nebula OS)</text>
      </g>

      <!-- Row 3: Client -->
      <g transform="translate(0, 48)">
        <circle cx="6" cy="0" r="2.8" fill="#00FF66" />
        <text x="18" y="4" class="info-label">Client</text>
        <text x="82" y="4" class="info-label">:</text>
        <text x="98" y="4" class="info-val">Flutter • Dart • Firebase</text>
      </g>

      <!-- Row 4: Status -->
      <g transform="translate(0, 72)">
        <circle cx="6" cy="0" r="4.2" fill="#00FF66" style="animation: pulseActiveGreen 2s ease-in-out infinite;" />
        <text x="18" y="4" class="info-label">Status</text>
        <text x="82" y="4" class="info-label">:</text>
        <text x="98" y="4" class="info-active">● Active (Production Clean)</text>
      </g>
    </g>
  </g>

  <line x1="20" y1="190" x2="860" y2="190" stroke="#161D36" stroke-width="1" />

  <!-- Bottom Command Prompt Line (Real Projects) -->
  <g transform="translate(24, 218)">
    <text x="0" y="0" class="prompt-text">&gt; aether-kernel --target sm6150 --features dc_dim,hbm,badusb [Synced]</text>
    <rect x="525" y="-11" width="8" height="14" class="cursor" />
  </g>
</svg>