<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="100%">
  <defs>
    <!-- Terminal Outer Frame & Neon Glow -->
    <linearGradient id="termBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Matrix Green Neon Glow Filter for ASCII Art -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00FF66" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00FF66" flood-opacity="0.4" />
    </filter>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="scanLaserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="20%" stop-color="#70FF9C" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="80%" stop-color="#70FF9C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseActiveGreen {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #00FF66); }
      50% { opacity: 1; filter: drop-shadow(0 0 7px #00FF66); }
    }
    @keyframes laserSweep {
      0% { transform: translateY(-4px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(72px); opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-window {
      fill: #060913;
      stroke: url(#termBorderGrad);
      stroke-width: 1.2;
      rx: 10px;
    }
    .term-title {
      font-family: 'SF Mono', 'Fira Code', 'DejaVu Sans Mono', 'Ubuntu Mono', 'Consolas', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #64748B;
      letter-spacing: 0.5px;
    }
    .hud-bracket {
      fill: none;
      stroke: #00E5FF;
      stroke-width: 1.5;
      stroke-linecap: square;
    }
    .matrix-ascii {
      font-family: 'SF Mono', 'Fira Code', 'DejaVu Sans Mono', 'Ubuntu Mono', 'Consolas', 'Courier New', monospace;
      font-size: 12.5px;
      font-weight: 700;
      fill: #00FF66;
      letter-spacing: 0px;
      filter: url(#matrixGlow);
    }
    .term-sub {
      font-family: 'SF Mono', 'Fira Code', 'DejaVu Sans Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      fill: #00FF66;
      letter-spacing: 0.8px;
    }
    .info-panel {
      fill: #090E1F;
      stroke: #1E293B;
      stroke-width: 1;
      rx: 6px;
    }
    .info-label {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #64748B;
    }
    .info-val {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .info-active {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #00FF66;
    }
    .prompt-text {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #C084FC;
    }
    .cursor {
      fill: #00FF66;
      animation: blinkCursor 1.1s infinite;
    }
  </style>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="876" height="246" class="term-window" />

  <!-- macOS Window Controls (Traffic Lights) -->
  <g transform="translate(18, 16)">
    <circle cx="0" cy="0" r="4.5" fill="#EF4444" />
    <circle cx="14" cy="0" r="4.5" fill="#F59E0B" />
    <circle cx="28" cy="0" r="4.5" fill="#10B981" />
  </g>

  <!-- Terminal Title Bar -->
  <text x="440" y="20" text-anchor="middle" class="term-title">kiran-embedded@README: ~</text>
  <line x1="2" y1="32" x2="878" y2="32" stroke="#131B2E" stroke-width="1" />

  <!-- LEFT: Matrix Cyber AETHER ASCII Art with HUD Brackets & Laser Sweep -->
  <g transform="translate(36, 48)">
    <!-- Corner HUD Targeting Brackets -->
    <path d="M -8 2 L -14 2 L -14 8" class="hud-bracket" />
    <path d="M 334 2 L 340 2 L 340 8" class="hud-bracket" />
    <path d="M -14 62 L -14 68 L -8 68" class="hud-bracket" />
    <path d="M 340 62 L 340 68 L 334 68" class="hud-bracket" />

    <!-- Pure Matrix Terminal ASCII Art -->
    <g class="matrix-ascii" xml:space="preserve">
      <text x="0" y="12">    _    _____ _____ _   _ _____ ____  </text>
      <text x="0" y="25">   / \  | ____|_   _| | | | ____|  _ \ </text>
      <text x="0" y="38">  / _ \ |  _|   | | | |_| |  _| | |_) |</text>
      <text x="0" y="51"> / ___ \| |___  | | |  _  | |___|  _ &lt; </text>
      <text x="0" y="64">/_/   \_\_____| |_| |_| |_|_____|_| \_\</text>
    </g>

    <!-- Animated Scanning Laser Beam Sweep -->
    <g style="animation: laserSweep 3.2s ease-in-out infinite;">
      <line x1="-12" y1="0" x2="338" y2="0" stroke="url(#scanLaserGrad)" stroke-width="2" filter="url(#laserGlow)" />
    </g>

    <!-- Subtitle (Row 1 - Clean & Free of Overlap) -->
    <g transform="translate(0, 84)">
      <circle cx="4" cy="-4" r="3.2" fill="#00FF66" style="animation: pulseActiveGreen 1.8s infinite;" />
      <text x="16" y="0" class="term-sub">KIRAN EMBEDDED // LOW-LEVEL SYSTEMS LAB</text>
    </g>

    <!-- Real Hardware Tags (Row 2 - Zero Overlap, Simple Real Words) -->
    <g transform="translate(0, 105)">
      <rect x="0" y="-11" width="102" height="17" rx="4" fill="#0A1D13" stroke="#00FF66" stroke-width="0.9" />
      <text x="51" y="2" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#70FF9C" text-anchor="middle">Redmi Note 10</text>

      <rect x="110" y="-11" width="104" height="17" rx="4" fill="#0B1626" stroke="#38BDF8" stroke-width="0.9" />
      <text x="162" y="2" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#38BDF8" text-anchor="middle">Snapdragon 678</text>

      <rect x="222" y="-11" width="94" height="17" rx="4" fill="#18112E" stroke="#A855F7" stroke-width="0.9" />
      <text x="269" y="2" font-family="'SF Mono', 'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#C084FC" text-anchor="middle">Android 16/17</text>
    </g>
  </g>

  <!-- RIGHT: System Info Telemetry Panel (Simple, Real Words, High Contrast) -->
  <g transform="translate(440, 48)">
    <rect x="0" y="0" width="410" height="128" class="info-panel" />

    <g transform="translate(20, 24)">
      <!-- Row 1: Kernel -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="0" r="2.8" fill="#00FF66" />
        <text x="18" y="4" class="info-label">Kernel</text>
        <text x="82" y="4" class="info-label">:</text>
        <text x="98" y="4" class="info-val">AETHER v1.8 (Redmi Note 10)</text>
      </g>

      <!-- Row 2: Firmware -->
      <g transform="translate(0, 24)">
        <circle cx="6" cy="0" r="2.8" fill="#00FF66" />
        <text x="18" y="4" class="info-label">Firmware</text>
        <text x="82" y="4" class="info-label">:</text>
        <text x="98" y="4" class="info-val">ESP32 • Arduino Uno (Nebula)</text>
      </g>

      <!-- Row 3: Apps -->
      <g transform="translate(0, 48)">
        <circle cx="6" cy="0" r="2.8" fill="#00FF66" />
        <text x="18" y="4" class="info-label">Apps</text>
        <text x="82" y="4" class="info-label">:</text>
        <text x="98" y="4" class="info-val">Flutter • Dart • Firebase</text>
      </g>

      <!-- Row 4: Status (Active, Simple and Real) -->
      <g transform="translate(0, 72)">
        <circle cx="6" cy="0" r="4.2" fill="#00FF66" style="animation: pulseActiveGreen 2s ease-in-out infinite;" />
        <text x="18" y="4" class="info-label">Status</text>
        <text x="82" y="4" class="info-label">:</text>
        <text x="98" y="4" class="info-active">● Active</text>
      </g>
    </g>
  </g>

  <line x1="20" y1="196" x2="860" y2="196" stroke="#131B2E" stroke-width="1" />

  <!-- Bottom Command Line (Real Projects, Clean Words) -->
  <g transform="translate(24, 222)">
    <text x="0" y="0" class="prompt-text">&gt; git status: AETHER-Kernel • esp32-smart-light • NEBULA-OS [Clean]</text>
    <rect x="525" y="-11" width="8" height="14" class="cursor" />
  </g>
</svg>
