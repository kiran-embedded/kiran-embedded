<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="projBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2E2054" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A1838" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="subcardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2A6B" />
      <stop offset="100%" stop-color="#1A1538" />
    </linearGradient>
  </defs>

  <style>
    .card-bg {
      fill: #0B0E1E;
      stroke: url(#projBorder);
      stroke-width: 1.2;
      rx: 12px;
    }
    .head-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .head-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #C084FC;
    }
    .subcard {
      fill: #0E1224;
      stroke: url(#subcardBorder);
      stroke-width: 1.1;
      rx: 8px;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #FFFFFF;
    }
    .proj-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      fill: #CBD5E1;
    }
    .tag-bg {
      fill: #141B33;
      stroke: #252F52;
      stroke-width: 0.8;
      rx: 4px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      fill: #93C5FD;
    }
    .feat-bg {
      fill: #2D154B;
      stroke: #6B21A8;
      stroke-width: 0.8;
      rx: 4px;
    }
    .feat-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9px;
      font-weight: 700;
      fill: #C084FC;
    }
    .star-text {
      font-family: 'Fira Code', 'SF Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #E2E8F0;
    }
  </style>

  <!-- Main Container Card -->
  <rect x="2" y="2" width="916" height="246" class="card-bg" />

  <!-- Header -->
  <g transform="translate(24, 28)">
    <rect x="0" y="-12" width="24" height="24" rx="6" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.2" />
    <path d="M 12 -7 L 16 1 L 8 1 Z" fill="#C084FC" />
    <circle cx="12" cy="-1" r="1.5" fill="#0B0E1E" />
    <text x="34" y="5" class="head-title">Projects &amp; Repositories</text>
    <text x="866" y="5" text-anchor="end" class="head-link">View All Repositories →</text>
  </g>

  <!-- 2x2 Grid of Real Projects -->
  <!-- 1. Top-Left: AETHER Kernel -->
  <g transform="translate(24, 50)">
    <rect x="0" y="0" width="424" height="88" class="subcard" />
    <rect x="12" y="14" width="30" height="30" rx="6" fill="#1A1538" stroke="#3B2A6B" stroke-width="1" />
    <text x="27" y="33" font-size="14" text-anchor="middle">⚡</text>

    <text x="50" y="27" class="proj-title">AETHER Kernel</text>
    <rect x="156" y="16" width="56" height="15" class="feat-bg" />
    <text x="184" y="27" class="feat-text" text-anchor="middle">Featured</text>

    <text x="50" y="44" class="proj-desc">Xiaomi Redmi Note 10 (mojito / SM6150) — Android 16/17</text>

    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="32" height="18" class="tag-bg" />
      <text x="16" y="12" class="tag-text" text-anchor="middle">C</text>

      <rect x="36" y="0" width="50" height="18" class="tag-bg" />
      <text x="61" y="12" class="tag-text" text-anchor="middle">Kernel</text>

      <rect x="90" y="0" width="68" height="18" class="tag-bg" />
      <text x="124" y="12" class="tag-text" text-anchor="middle">Qualcomm</text>

      <g transform="translate(375, 12)">
        <text x="0" y="0" class="star-text">⭐ 1</text>
      </g>
    </g>
  </g>

  <!-- 2. Top-Right: ESP32 Smart Light -->
  <g transform="translate(472, 50)">
    <rect x="0" y="0" width="424" height="88" class="subcard" />
    <rect x="12" y="14" width="30" height="30" rx="6" fill="#0E1E38" stroke="#1D3E6B" stroke-width="1" />
    <text x="27" y="33" font-size="14" text-anchor="middle">💡</text>

    <text x="50" y="27" class="proj-title">ESP32 Smart Light</text>
    <text x="50" y="44" class="proj-desc">Cloud-based ESP32 IoT app with real-time Firebase telemetry</text>

    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="52" height="18" class="tag-bg" />
      <text x="26" y="12" class="tag-text" text-anchor="middle">Flutter</text>

      <rect x="56" y="0" width="40" height="18" class="tag-bg" />
      <text x="76" y="12" class="tag-text" text-anchor="middle">Dart</text>

      <rect x="100" y="0" width="60" height="18" class="tag-bg" />
      <text x="130" y="12" class="tag-text" text-anchor="middle">Firebase</text>

      <g transform="translate(372, 12)">
        <text x="0" y="0" class="star-text">⭐ 2</text>
      </g>
    </g>
  </g>

  <!-- 3. Bottom-Left: Nebula OS -->
  <g transform="translate(24, 146)">
    <rect x="0" y="0" width="424" height="88" class="subcard" />
    <rect x="12" y="14" width="30" height="30" rx="6" fill="#132B25" stroke="#1C5242" stroke-width="1" />
    <text x="27" y="33" font-size="14" text-anchor="middle">🔌</text>

    <text x="50" y="27" class="proj-title">Nebula OS</text>
    <text x="50" y="44" class="proj-desc">Adaptive Arduino Uno firmware with smart thermals &amp; EEPROM</text>

    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="40" height="18" class="tag-bg" />
      <text x="20" y="12" class="tag-text" text-anchor="middle">C++</text>

      <rect x="44" y="0" width="54" height="18" class="tag-bg" />
      <text x="71" y="12" class="tag-text" text-anchor="middle">Arduino</text>

      <rect x="102" y="0" width="64" height="18" class="tag-bg" />
      <text x="134" y="12" class="tag-text" text-anchor="middle">Embedded</text>

      <g transform="translate(375, 12)">
        <text x="0" y="0" class="star-text">⭐ 1</text>
      </g>
    </g>
  </g>

  <!-- 4. Bottom-Right: MicFix Module -->
  <g transform="translate(472, 146)">
    <rect x="0" y="0" width="424" height="88" class="subcard" />
    <rect x="12" y="14" width="30" height="30" rx="6" fill="#2E1538" stroke="#5B2273" stroke-width="1" />
    <text x="27" y="33" font-size="14" text-anchor="middle">🎧</text>

    <text x="50" y="27" class="proj-title">MicFix Audio Module</text>
    <text x="50" y="44" class="proj-desc">Zero-CPU audio routing &amp; mic clarity for rooted Android</text>

    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="42" height="18" class="tag-bg" />
      <text x="21" y="12" class="tag-text" text-anchor="middle">Shell</text>

      <rect x="46" y="0" width="62" height="18" class="tag-bg" />
      <text x="77" y="12" class="tag-text" text-anchor="middle">KernelSU</text>

      <rect x="112" y="0" width="44" height="18" class="tag-bg" />
      <text x="134" y="12" class="tag-text" text-anchor="middle">Audio</text>

      <g transform="translate(372, 12)">
        <text x="0" y="0" class="star-text">⭐ 2</text>
      </g>
    </g>
  </g>
</svg>