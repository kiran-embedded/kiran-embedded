<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="projBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2E2054" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A1838" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subcard Border Gradient -->
    <linearGradient id="subcardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2A6B" />
      <stop offset="100%" stop-color="#1A1538" />
    </linearGradient>
  </defs>

  <style>
    .card-bg {
      fill: #0B0E1E;
      stroke: url(#projBorder);
      stroke-width: 1.2;
      rx: 12px;
    }
    .head-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .head-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #A855F7;
    }
    .subcard {
      fill: #0E1224;
      stroke: url(#subcardBorder);
      stroke-width: 1.1;
      rx: 8px;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #FFFFFF;
    }
    .proj-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      fill: #94A3B8;
    }
    .tag-bg {
      fill: #141B33;
      stroke: #252F52;
      stroke-width: 0.8;
      rx: 4px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      fill: #93C5FD;
    }
    .feat-bg {
      fill: #2D154B;
      stroke: #6B21A8;
      stroke-width: 0.8;
      rx: 4px;
    }
    .feat-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9px;
      font-weight: 700;
      fill: #C084FC;
    }
    .star-text {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #CBD5E1;
    }
  </style>

  <!-- Main Container Card -->
  <rect x="2" y="2" width="916" height="246" class="card-bg" />

  <!-- Header -->
  <g transform="translate(24, 28)">
    <rect x="0" y="-12" width="24" height="24" rx="6" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.2" />
    <path d="M 12 -7 L 16 1 L 8 1 Z" fill="#C084FC" />
    <circle cx="12" cy="-1" r="1.5" fill="#0B0E1E" />
    <text x="34" y="5" class="head-title">Projects &amp; Repositories</text>
    <text x="866" y="5" text-anchor="end" class="head-link">View All Repositories →</text>
  </g>

  <!-- 2x2 Grid of Projects -->
  <!-- 1. Top-Left: AETHER Kernel -->
  <g transform="translate(24, 50)">
    <rect x="0" y="0" width="424" height="88" class="subcard" />
    <!-- Icon Container -->
    <rect x="12" y="14" width="30" height="30" rx="6" fill="#1A1538" stroke="#3B2A6B" stroke-width="1" />
    <text x="27" y="33" font-size="14" text-anchor="middle">⚡</text>

    <!-- Title & Badge -->
    <text x="50" y="27" class="proj-title">AETHER Kernel</text>
    <rect x="156" y="16" width="56" height="15" class="feat-bg" />
    <text x="184" y="27" class="feat-text" text-anchor="middle">Featured</text>

    <!-- Subtitle -->
    <text x="50" y="44" class="proj-desc">Linux Kernel Subsystem for Qualcomm SM6150 (Redmi Note 10)</text>

    <!-- Tags & Star Count -->
    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="44" height="18" class="tag-bg" />
      <text x="22" y="12" class="tag-text" text-anchor="middle">Linux</text>

      <rect x="48" y="0" width="50" height="18" class="tag-bg" />
      <text x="73" y="12" class="tag-text" text-anchor="middle">Kernel</text>

      <rect x="102" y="0" width="68" height="18" class="tag-bg" />
      <text x="136" y="12" class="tag-text" text-anchor="middle">Qualcomm</text>

      <!-- Star Count -->
      <g transform="translate(365, 12)">
        <text x="0" y="0" class="star-text">⭐ 22</text>
      </g>
    </g>
  </g>

  <!-- 2. Top-Right: Flutter & Cross-Platform UI -->
  <g transform="translate(472, 50)">
    <rect x="0" y="0" width="424" height="88" class="subcard" />
    <!-- Icon Container -->
    <rect x="12" y="14" width="30" height="30" rx="6" fill="#0E1E38" stroke="#1D3E6B" stroke-width="1" />
    <text x="27" y="33" font-size="14" text-anchor="middle">📱</text>

    <!-- Title -->
    <text x="50" y="27" class="proj-title">Flutter &amp; Cross-Platform UI</text>

    <!-- Subtitle -->
    <text x="50" y="44" class="proj-desc">Responsive Hardware Telemetry &amp; Control Dashboards</text>

    <!-- Tags & Star Count -->
    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="52" height="18" class="tag-bg" />
      <text x="26" y="12" class="tag-text" text-anchor="middle">Flutter</text>

      <rect x="56" y="0" width="40" height="18" class="tag-bg" />
      <text x="76" y="12" class="tag-text" text-anchor="middle">Dart</text>

      <rect x="100" y="0" width="60" height="18" class="tag-bg" />
      <text x="130" y="12" class="tag-text" text-anchor="middle">Firebase</text>

      <g transform="translate(372, 12)">
        <text x="0" y="0" class="star-text">⭐ 6</text>
      </g>
    </g>
  </g>

  <!-- 3. Bottom-Left: Embedded IoT & Firmware -->
  <g transform="translate(24, 146)">
    <rect x="0" y="0" width="424" height="88" class="subcard" />
    <rect x="12" y="14" width="30" height="30" rx="6" fill="#132B25" stroke="#1C5242" stroke-width="1" />
    <text x="27" y="33" font-size="14" text-anchor="middle">🔌</text>

    <text x="50" y="27" class="proj-title">Embedded IoT &amp; Firmware</text>
    <text x="50" y="44" class="proj-desc">ESP32 &amp; Arduino Uno Hardware Systems</text>

    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="52" height="18" class="tag-bg" />
      <text x="26" y="12" class="tag-text" text-anchor="middle">ESP32</text>

      <rect x="56" y="0" width="56" height="18" class="tag-bg" />
      <text x="84" y="12" class="tag-text" text-anchor="middle">Arduino</text>

      <rect x="116" y="0" width="36" height="18" class="tag-bg" />
      <text x="134" y="12" class="tag-text" text-anchor="middle">IoT</text>

      <g transform="translate(372, 12)">
        <text x="0" y="0" class="star-text">⭐ 3</text>
      </g>
    </g>
  </g>

  <!-- 4. Bottom-Right: Audio & DSP Processing -->
  <g transform="translate(472, 146)">
    <rect x="0" y="0" width="424" height="88" class="subcard" />
    <rect x="12" y="14" width="30" height="30" rx="6" fill="#2E1538" stroke="#5B2273" stroke-width="1" />
    <text x="27" y="33" font-size="14" text-anchor="middle">🎧</text>

    <text x="50" y="27" class="proj-title">Audio &amp; DSP Processing</text>
    <text x="50" y="44" class="proj-desc">Acoustic Processing &amp; Audio Routing</text>

    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="40" height="18" class="tag-bg" />
      <text x="20" y="12" class="tag-text" text-anchor="middle">DSP</text>

      <rect x="44" y="0" width="46" height="18" class="tag-bg" />
      <text x="67" y="12" class="tag-text" text-anchor="middle">ALSA</text>

      <rect x="94" y="0" width="86" height="18" class="tag-bg" />
      <text x="137" y="12" class="tag-text" text-anchor="middle">Noise Filtering</text>

      <g transform="translate(372, 12)">
        <text x="0" y="0" class="star-text">⭐ 2</text>
      </g>
    </g>
  </g>
</svg>