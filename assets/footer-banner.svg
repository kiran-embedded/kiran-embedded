<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="100%">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0A22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#04060E" stop-opacity="1" />
    </linearGradient>
    <filter id="fGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
