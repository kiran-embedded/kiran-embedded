    </filter>
  </defs>

  <!-- Mountain Silhouette Base -->
  <path d="M 0 80 L 0 45 L 80 25 L 170 40 L 260 20 L 360 45 L 460 15 L 560 38 L 660 18 L 760 42 L 850 22 L 920 40 L 920 80 Z" fill="url(#footerGrad)" />
  <path d="M 0 80 L 0 55 L 100 40 L 220 52 L 340 35 L 460 50 L 580 32 L 700 48 L 820 36 L 920 50 L 920 80 Z" fill="#04060E" />

  <!-- Center Accent Glowing Line -->
