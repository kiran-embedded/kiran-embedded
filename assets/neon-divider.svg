<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 28" width="100%" height="28">
  <defs>
    <linearGradient id="laserPixelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0" />
      <stop offset="25%" stop-color="#FF1744" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="1" />
      <stop offset="75%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>
    <filter id="laserLedGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="bloom"/>
      <feMerge>
        <feMergeNode in="bloom"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes moveLaserPulse {
      0% { stroke-dashoffset: 460; }
      100% { stroke-dashoffset: -460; }
    }
    .track-line {
      stroke: #121A2A;
      stroke-width: 1.5;
    }
    .led-laser {
      stroke: url(#laserPixelGrad);
      stroke-width: 2.5;
      stroke-dasharray: 12 8;
      animation: moveLaserPulse 5s linear infinite;
      filter: url(#laserLedGlow);
    }
    .diamond-left {
      fill: #FF1744;
      filter: drop-shadow(0 0 6px #FF1744);
    }
    .diamond-right {
      fill: #00FF66;
      filter: drop-shadow(0 0 6px #00FF66);
    }
  </style>
  <line x1="20" y1="14" x2="900" y2="14" class="track-line" />
  <line x1="20" y1="14" x2="900" y2="14" class="led-laser" />
  <polygon points="450,9 455,14 450,19 445,14" class="diamond-left" />
  <polygon points="470,9 475,14 470,19 465,14" class="diamond-right" />
</svg>
