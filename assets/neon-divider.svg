<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 24" width="100%" height="24">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00D4FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1" />
      <stop offset="70%" stop-color="#00FFCC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0" />
    </linearGradient>
    <filter id="laserBloom" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="bloom"/>
      <feMerge>
        <feMergeNode in="bloom"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes pulseBeam {
      0% { stroke-dashoffset: 920; }
      100% { stroke-dashoffset: -920; }
    }
    .base-line {
      stroke: #162032;
      stroke-width: 1.5;
    }
    .laser-beam {
      stroke: url(#dividerGrad);
      stroke-width: 2.5;
      stroke-dasharray: 240 680;
      animation: pulseBeam 4s ease-in-out infinite alternate;
      filter: url(#laserBloom);
    }
    .center-diamond {
      fill: #00D4FF;
      filter: drop-shadow(0 0 6px #00D4FF);
    }
  </style>
  <line x1="20" y1="12" x2="900" y2="12" class="base-line" />
  <line x1="20" y1="12" x2="900" y2="12" class="laser-beam" />
  <polygon points="460,7 465,12 460,17 455,12" class="center-diamond" />
</svg>
