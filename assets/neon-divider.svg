<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 20" width="100%" height="20">
  <defs>
    <!-- Single-Color Emerald Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="25%" stop-color="#00FF66" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="1" />
      <stop offset="75%" stop-color="#00FF66" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes moveLaserPulse {
      0% { stroke-dashoffset: 460; }
      100% { stroke-dashoffset: -460; }
    }
  </style>

  <line x1="20" y1="10" x2="900" y2="10" stroke="#0A1C12" stroke-width="1.2" />
  <line x1="20" y1="10" x2="900" y2="10" stroke="url(#laserGrad)" stroke-width="2.2" stroke-dasharray="14 10" style="animation: moveLaserPulse 4s linear infinite; filter: url(#laserGlow);" />
  <polygon points="460,5 466,10 460,15 454,10" fill="#00FF66" style="filter: drop-shadow(0 0 6px #00FF66);" />
</svg>